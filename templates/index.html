<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Resume Workspace Control Center</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #1e1e24; color: #e2e8f0; margin: 0; padding: 30px; }
        .dashboard { max-width: 900px; margin: 0 auto; }
        header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #334155; padding-bottom: 20px; margin-bottom: 30px; }
        h1 { margin: 0; font-size: 24px; color: #E68A5C; }
        .btn-group button { background: #E68A5C; color: white; border: none; padding: 10px 20px; border-radius: 6px; cursor: pointer; font-weight: bold; margin-left: 10px; }
        .btn-group button.secondary { background: #475569; }
        .btn-group button:hover { opacity: 0.9; }
        .card { background: #2d3748; padding: 25px; border-radius: 8px; margin-bottom: 25px; box-shadow: 0 4px 6px rgba(0,0,0,0.2); }
        .card h2 { margin-top: 0; color: #cbd5e1; font-size: 18px; border-bottom: 1px solid #4a5568; padding-bottom: 8px; margin-bottom: 15px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 6px; font-size: 13px; color: #94a3b8; font-weight: 600; }
        input, textarea { width: 100%; padding: 10px; background: #1e1e24; border: 1px solid #4a5568; color: white; border-radius: 6px; box-sizing: border-box; font-family: inherit; }
        textarea { height: 80px; resize: vertical; }
        .repeater-item { background: #232d3d; padding: 15px; border-radius: 6px; margin-bottom: 15px; border-left: 4px solid #E68A5C; position: relative; }
        .remove-btn { color: #f87171; background: none; border: none; cursor: pointer; float: right; font-size: 13px; margin-top: -5px; }
        .add-btn { background: #334155; color: #cbd5e1; border: none; padding: 8px 14px; border-radius: 4px; cursor: pointer; font-size: 13px; }
        .add-btn:hover { background: #475569; }
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
    </style>
</head>
<body>

<div class="dashboard">
    <header>
        <h1>Resume Control Center Workspace</h1>
        <div class="btn-group">
            <button class="secondary" onclick="saveData(false)">Save JSON Changes</button>
            <button onclick="saveData(true)">Save & Compile Build</button>
        </div>
    </header>

    <form id="resumeForm">
        <div class="card">
            <h2>Personal Basics</h2>
            <div class="form-group"><label>Full Name</label><input type="text" id="basics_name"></div>
            <div class="grid-2">
                <div class="form-group"><label>Label / Specialization</label><input type="text" id="basics_label"></div>
                <div class="form-group"><label>Email</label><input type="email" id="basics_email"></div>
            </div>
            <div class="grid-2">
                <div class="form-group"><label>Phone</label><input type="text" id="basics_phone"></div>
                <div class="form-group"><label>Location</label><input type="text" id="basics_location"></div>
            </div>
            <div class="form-group"><label>Professional Profile Summary</label><textarea id="basics_summary"></textarea></div>
        </div>

        <div class="card">
            <h2 style="display: inline-block;">Websites & Portfolios</h2>
            <button type="button" class="add-btn" style="float: right;" onclick="addLink()">+ Add Link Entry</button>
            <div id="linksContainer"></div>
        </div>

        <div class="card">
            <h2 style="display: inline-block;">Core Technical Competencies</h2>
            <button type="button" class="add-btn" style="float: right;" onclick="addSkillCategory()">+ Add Skill Group</button>
            <div id="skillsContainer"></div>
        </div>

        <div class="card">
            <h2 style="display: inline-block;">Professional Experience</h2>
            <button type="button" class="add-btn" style="float: right;" onclick="addExperience()">+ Add Work Entry</button>
            <div id="experienceContainer"></div>
        </div>

        <div class="card">
            <h2 style="display: inline-block;">Education Timeline History</h2>
            <button type="button" class="add-btn" style="float: right;" onclick="addEducation()">+ Add Education Milestone</button>
            <div id="educationContainer"></div>
        </div>

        <div class="card">
            <h2 style="display: inline-block;">Project Portfolio Blocks</h2>
            <button type="button" class="add-btn" style="float: right;" onclick="addProject()">+ Add Project Element</button>
            <div id="projectsContainer"></div>
        </div>
    </form>
</div>

<script>
/* INITIAL_DATA_INJECTION */

function addLink(data = {}) {
    document.getElementById('linksContainer').insertAdjacentHTML('beforeend', `
        <div class="repeater-item link-node" style="border-left-color: #4a5568;">
            <button type="button" class="remove-btn" onclick="this.parentElement.remove()">Delete</button>
            <div class="grid-2">
                <div><label>Platform Name</label><input type="text" class="link-label" value="${data.label || ''}"></div>
                <div><label>URL</label><input type="url" class="link-url" value="${data.url || ''}"></div>
            </div>
        </div>`);
}

function addSkillCategory(data = {}) {
    document.getElementById('skillsContainer').insertAdjacentHTML('beforeend', `
        <div class="repeater-item skill-node" style="border-left-color: #cbd5e1;">
            <button type="button" class="remove-btn" onclick="this.parentElement.remove()">Delete Category</button>
            <div class="form-group"><label>Skill Group Title</label><input type="text" class="skill-cat-name" value="${data.category || ''}"></div>
            <div class="form-group"><label>Skills (Comma Separated)</label><input type="text" class="skill-items" value="${data.items ? data.items.join(', ') : ''}"></div>
        </div>`);
}

function addExperience(data = {}) {
    document.getElementById('experienceContainer').insertAdjacentHTML('beforeend', `
        <div class="repeater-item exp-node" style="border-left-color: #f59e0b;">
            <button type="button" class="remove-btn" onclick="this.parentElement.remove()">Delete Job</button>
            <div class="grid-2">
                <div><label>Company / Organization</label><input type="text" class="exp-company" value="${data.company || ''}"></div>
                <div><label>Role / Position Title</label><input type="text" class="exp-role" value="${data.role || ''}"></div>
            </div>
            <div class="form-group" style="margin-top:10px;"><label>Timeline Period (e.g., 2024 - Present)</label><input type="text" class="exp-timeline" value="${data.timeline || ''}"></div>
            <div class="form-group"><label>Core Responsibilities Summary</label><textarea class="exp-details">${data.details || ''}</textarea></div>
        </div>`);
}

function addEducation(data = {}) {
    document.getElementById('educationContainer').insertAdjacentHTML('beforeend', `
        <div class="repeater-item edu-node" style="border-left-color: #10b981;">
            <button type="button" class="remove-btn" onclick="this.parentElement.remove()">Delete Milestone</button>
            <div class="grid-2">
                <div><label>Institution Name</label><input type="text" class="edu-institution" value="${data.institution || ''}"></div>
                <div><label>Degree / Program / Specialization</label><input type="text" class="edu-degree" value="${data.degree || ''}"></div>
            </div>
            <div class="grid-2" style="margin-top:10px;">
                <div><label>Timeline Period</label><input type="text" class="edu-timeline" value="${data.timeline || ''}"></div>
                <div><label>Location (City, Country)</label><input type="text" class="edu-location" value="${data.location || ''}"></div>
            </div>
        </div>`);
}

function addProject(data = {}) {
    document.getElementById('projectsContainer').insertAdjacentHTML('beforeend', `
        <div class="repeater-item project-node">
            <button type="button" class="remove-btn" onclick="this.parentElement.remove()">Delete Entry</button>
            <div class="grid-2" style="margin-bottom: 10px;">
                <div><label>Project Name</label><input type="text" class="proj-name" value="${data.name || ''}"></div>
                <div><label>Your Role</label><input type="text" class="proj-role" value="${data.role || ''}"></div>
            </div>
            <div class="form-group"><label>Timeline Context</label><input type="text" class="proj-context" value="${data.context || ''}"></div>
            <div class="form-group"><label>Objective Description</label><textarea class="proj-desc">${data.description || ''}</textarea></div>
            <div class="form-group"><label>Milestone Highlights (One bullet item per line)</label><textarea class="proj-highlights">${data.highlights ? data.highlights.join('\n') : ''}</textarea></div>
        </div>`);
}

window.addEventListener('DOMContentLoaded', () => {
    if (typeof initialResumeData !== 'undefined') {
        document.getElementById('basics_name').value = initialResumeData.basics?.name || '';
        document.getElementById('basics_label').value = initialResumeData.basics?.label || '';
        document.getElementById('basics_email').value = initialResumeData.basics?.email || '';
        document.getElementById('basics_phone').value = initialResumeData.basics?.phone || '';
        document.getElementById('basics_location').value = initialResumeData.basics?.location || '';
        document.getElementById('basics_summary').value = initialResumeData.basics?.summary || '';
        
        if (initialResumeData.basics?.links) initialResumeData.basics.links.forEach(l => addLink(l));
        if (initialResumeData.skills_categories) initialResumeData.skills_categories.forEach(s => addSkillCategory(s));
        if (initialResumeData.experience) initialResumeData.experience.forEach(e => addExperience(e));
        if (initialResumeData.education_timeline) initialResumeData.education_timeline.forEach(ed => addEducation(ed));
        if (initialResumeData.projects) initialResumeData.projects.forEach(p => addProject(p));
    }
});

function compilePayload() {
    return {
        basics: {
            name: document.getElementById('basics_name').value,
            label: document.getElementById('basics_label').value,
            email: document.getElementById('basics_email').value,
            phone: document.getElementById('basics_phone').value,
            location: document.getElementById('basics_location').value,
            summary: document.getElementById('basics_summary').value,
            links: Array.from(document.querySelectorAll('.link-node')).map(node => ({
                label: node.querySelector('.link-label').value, url: node.querySelector('.link-url').value
            }))
        },
        skills_categories: Array.from(document.querySelectorAll('.skill-node')).map(node => ({
            category: node.querySelector('.skill-cat-name').value,
            items: node.querySelector('.skill-items').value.split(',').map(s => s.trim()).filter(s => s)
        })),
        experience: Array.from(document.querySelectorAll('.exp-node')).map(node => ({
            company: node.querySelector('.exp-company').value,
            role: node.querySelector('.exp-role').value,
            timeline: node.querySelector('.exp-timeline').value,
            details: node.querySelector('.exp-details').value
        })),
        education_timeline: Array.from(document.querySelectorAll('.edu-node')).map(node => ({
            institution: node.querySelector('.edu-institution').value,
            degree: node.querySelector('.edu-degree').value,
            timeline: node.querySelector('.edu-timeline').value,
            location: node.querySelector('.edu-location').value
        })),
        projects: Array.from(document.querySelectorAll('.project-node')).map(node => ({
            name: node.querySelector('.proj-name').value,
            role: node.querySelector('.proj-role').value,
            context: node.querySelector('.proj-context').value,
            description: node.querySelector('.proj-desc').value,
            highlights: node.querySelector('.proj-highlights').value.split('\n').filter(l => l.trim() !== "")
        }))
    };
}

async function saveData(shouldBuild) {
    try {
        const response = await fetch(shouldBuild ? '/api/build' : '/api/save', {
            method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(compilePayload())
        });
        alert((await response.json()).message);
    } catch (err) { alert("Network payload write error."); }
}
</script>
</body>
</html>
